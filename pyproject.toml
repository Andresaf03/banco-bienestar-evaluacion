[project]
name = "proyecto"
version = "0.1.0"
description = "Efecto del Plan de Expansión del Banco del Bienestar sobre la actividad financiera municipal (PPII, ITAM)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "tenacity>=9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "tqdm>=4.66",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.9",
    "truststore>=0.10.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
fase2 = [
    "pbixray==0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proyecto"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # URLs largas; el ancho lo gobierna ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
