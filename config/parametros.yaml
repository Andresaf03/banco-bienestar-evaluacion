    privado_largo: [tarjetas_credito_bm_pc, establecimientos_tpv_privado_pc]

# Efecto inyectado (exploratorio; analisis/15_poder_inyectado.R): ¿el DiD detecta un efecto chico que
# sí existe? Sucursales privadas ficticias sobre los datos, como en Bertrand, Duflo y Mullainathan
# (2004). `pct` es el efecto buscado en % de la media previa de las tratadas.
poder_inyectado:
  # Con las fechas reales solo varían el sorteo y el ee: bastan menos réplicas.
  replicas: {reasignadas: 200, reales: 100, todas: 200}
  # Se repiten con las fechas barajadas entre todas las unidades (ver `calibrado` en el script).
  escenarios_todas: ["atraccion_2.8", "atraccion_5", "desplazamiento_2.8", "desplazamiento_5"]
  semilla: 20261104
  nucleos: 6
  rezago_gradual_max: 4    # trimestres; "gradual" = la sucursal abre entre 0 y 4 trimestres después
  escenarios:
    - {nombre: "sin_efecto", tipo: "ninguno", pct: 0}
    - {nombre: "atraccion_2.8", tipo: "atraccion", pct: 2.8}
    - {nombre: "atraccion_5", tipo: "atraccion", pct: 5}
    - {nombre: "atraccion_7.6", tipo: "atraccion", pct: 7.6}
    - {nombre: "atraccion_5_gradual", tipo: "atraccion", pct: 5, gradual: true}
    - {nombre: "desplazamiento_2.8", tipo: "desplazamiento", pct: 2.8}
    - {nombre: "desplazamiento_5", tipo: "desplazamiento", pct: 5}
