  placebo: {inicio: "2017Q2", fin: "2021Q4", adelanto: 8}
  tendencia_previa: {inicio: "2017Q2", fin: "2018Q4"}
  # Portafolio CNBV (operativa 2016–2021, modelo Power Pivot 2022–2026). Los saldos se toman a fin
  # de trimestre; las transacciones se suman en los tres meses (siguen el pago bimestral).
  portafolio:
