                    "Núm. Contr. Otorgaron Tarj. Débito Pers. Morales"]
        modelo: ["Núm. Contr. Tarjeta de Débito"]
        flujo: false
      tarjetas_credito:
        operativa: ["Núm. Contr. Tarjetas Personas Físicas (Cart.Cons.)"]
        modelo: ["Núm. Contr. Tarjeta de Crédito"]
        flujo: false
      establecimientos_tpv:
        operativa: ["Número de Establecimientos con TPV"]
