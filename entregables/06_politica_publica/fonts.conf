<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Para el render a PDF con LibreOffice (ver README.md): sin esto no ve Lora ni Source Sans 3
     instaladas en ~/Library/Fonts y sustituye por sus fuentes propias. -->
<fontconfig>
  <dir>~/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <cachedir>~/.cache/fontconfig</cachedir>
</fontconfig>
